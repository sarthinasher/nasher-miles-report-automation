name: Inventory Report to Drive

on:
  schedule:
    - cron: "9 4 * * *"
  workflow_dispatch: {}

# One Vinculum user for every report job: two sessions at once kill each other
# (a run waits; note GitHub keeps only ONE waiting run per group).
concurrency:
  group: vinculum-session
  cancel-in-progress: false

jobs:
  run-inventory-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Inventory report script
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/inventory_report_to_drive.py
