name: Inventory Report to Drive

on:
  schedule:
    # 05:15 UTC (10:45 IST), was 04:09: it now runs ~35 min (17 locations) and must not
    # land while Sales (03:40) / Order Enquiry (04:35) hold the vinculum-session group -
    # GitHub keeps one waiting run per group and cancels the older one (2026-10-21).
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      locations:
        description: >-
          Vinculum locations to export and merge: blank = the repo variable
          VIN_LOCATIONS, else the script's default (Pick Pack / Order Enquiry: the 6 with
          orders, A03,GJ1,NM1,NM4,NM7,NM9; Inventory: all; Sales: one location). "all" = all 17;
          "A03,NM4" = only those; "all,-S01,-S02" = all but those.
        required: false
        default: ""

# One Vinculum user for every report job: two sessions at once kill each other
# (a run waits; note GitHub keeps only ONE waiting run per group).
concurrency:
  group: vinculum-session
  cancel-in-progress: false

jobs:
  run-inventory-report:
    runs-on: ubuntu-latest
    # Every location is exported and merged since 2026-10-19 (~2 min per location).
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Inventory report script
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          VIN_LOCATIONS: ${{ inputs.locations || vars.VIN_LOCATIONS }}
        run: python scripts/inventory_report_to_drive.py
