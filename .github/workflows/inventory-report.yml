name: Inventory Report to Drive

on:
  schedule:
    # 05:15 UTC (10:45 IST), was 04:09: it now runs ~35 min (17 locations) and must not
    # land while Sales (03:40) / Order Enquiry (04:35) hold the vinculum-session group -
    # GitHub keeps one waiting run per group and cancels the older one (2026-10-21).
    - cron: "15 5 * * *"
    # Catch-up (2026-10-23): exports ONLY if no inventory file dated today (IST) is in
    # Drive - the 05:15 run failed or was cancelled in the queue (20/21-Oct were lost:
    # a snapshot cannot be back-filled). 70 min after the last daily Vinculum cron (Order
    # Enquiry 09:35), so it normally queues behind nothing. GitHub has been starting this
    # repo's crons ~5 h late (05:15 -> ~10:10 UTC): this one lands ~15:45 UTC = 21:15 IST,
    # still the same IST day. Normally it lists Drive and exits without a Vinculum login.
    - cron: "45 10 * * *"
  workflow_dispatch:
    inputs:
      locations:
        description: >-
          Vinculum locations to export and merge: blank = the repo variable
          VIN_LOCATIONS, else the script's default (Pick Pack / Order Enquiry: the GT
          warehouses A03,GJ1,NM1,NM4,NM7,NM9,NM8 + N10,A06 once the login can switch to
          them; Inventory: all; Sales: one location). "all" = all 17; "A03,NM4" = only
          those; "all,-S01,-S02" = all but those; "?N10" = N10 if available.
        required: false
        default: ""

# One Vinculum user for every report job: two sessions at once kill each other
# (a run waits; note GitHub keeps only ONE waiting run per group).
concurrency:
  group: vinculum-session
  cancel-in-progress: false

jobs:
  run-inventory-report:
    runs-on: ubuntu-latest
    # Every location is exported and merged since 2026-10-19 (~2 min per location).
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Inventory report script
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          VIN_LOCATIONS: ${{ inputs.locations || vars.VIN_LOCATIONS }}
          INVENTORY_ONLY_IF_MISSING: ${{ github.event.schedule == '45 10 * * *' }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/inventory_report_to_drive.py
