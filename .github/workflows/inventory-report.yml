name: Inventory Report to Drive

on:
  schedule:
    - cron: "9 4 * * *"
  workflow_dispatch:
    inputs:
      locations:
        description: >-
          Vinculum locations to export and merge (2026-10-19): blank = the repo variable
          VIN_LOCATIONS, else every location the login can switch to. "A03,NM4" = only
          those; "all,-S01,-S02" = all but those.
        required: false
        default: ""

# One Vinculum user for every report job: two sessions at once kill each other
# (a run waits; note GitHub keeps only ONE waiting run per group).
concurrency:
  group: vinculum-session
  cancel-in-progress: false

jobs:
  run-inventory-report:
    runs-on: ubuntu-latest
    # Every location is exported and merged since 2026-10-19 (~2 min per location).
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Inventory report script
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          VIN_LOCATIONS: ${{ inputs.locations || vars.VIN_LOCATIONS }}
        run: python scripts/inventory_report_to_drive.py
