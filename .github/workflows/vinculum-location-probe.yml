name: Vinculum Location Probe (diagnostic)

# 2026-10-19, manual runs only.
#  mode=probe (default): READ-ONLY. Logs in once, lists every location / warehouse
#    selector on the header, home, Switch Location dialog, Pick Pack, Sales and Order
#    Enquiry screens (options + selected), counts rows per Source WH in a few Drive
#    report files, uploads screenshots + redacted HTML. Saves nothing in Vinculum.
#  mode=dry_run: runs one report script for report_date over the chosen locations
#    with VIN_DRY_RUN=true - switches location, exports, merges, but does NOT upload
#    to Drive; the merged file is in the artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = read-only UI dump; dry_run = export + merge one report, no Drive upload"
        type: choice
        options: [probe, dry_run]
        default: probe
      report:
        description: "dry_run only: which report"
        type: choice
        options: [pickpack, sales, order_enquiry, inventory]
        default: pickpack
      report_date:
        description: "dry_run only: DD/MM/YYYY (inventory ignores it)"
        required: false
        default: ""
      locations:
        description: "dry_run only: VIN_LOCATIONS (blank = all the login can switch to)"
        required: false
        default: ""

# One Vinculum user for every report job: two sessions at once kill each other.
concurrency:
  group: vinculum-session
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest==9.1.1

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run Vinculum location probe
        if: inputs.mode != 'dry_run'
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          PROBE_DIR: /tmp/vinculum_probe
          PYTHONUNBUFFERED: "1"
        run: python scripts/vinculum_location_probe.py

      - name: Dry run one report (no Drive upload)
        if: inputs.mode == 'dry_run'
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          VIN_DRY_RUN: "true"
          VIN_LOCATIONS: ${{ inputs.locations }}
          REPORT_DATE: ${{ inputs.report_date }}
          PICKPACK_DEBUG_DIR: /tmp/vinculum_probe
          SALES_DEBUG_DIR: /tmp/vinculum_probe
          ORDER_ENQUIRY_DEBUG_DIR: /tmp/vinculum_probe
          INVENTORY_DEBUG_DIR: /tmp/vinculum_probe
          REPORT: ${{ inputs.report }}
          PYTHONUNBUFFERED: "1"
        run: |
          case "$REPORT" in
            pickpack)      script=scripts/pickpack_report_to_drive.py ;;
            sales)         script=scripts/vinculum_sales_report_to_drive.py ;;
            order_enquiry) script=scripts/order_enquiry_report_to_drive.py ;;
            inventory)     script=scripts/inventory_report_to_drive.py ;;
            *) echo "unknown report $REPORT"; exit 2 ;;
          esac
          python "$script"

      - name: Upload probe / dry-run files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinculum-location-probe
          path: /tmp/vinculum_probe
          if-no-files-found: ignore
