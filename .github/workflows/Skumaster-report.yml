name: SKU Master Report

# Runs once a week. Off-peak, non-round minute to dodge GitHub's shared-runner
# queue at the top of the hour, and spaced away from the daily Pick Pack /
# Sales runs.
on:
  schedule:
    - cron: "47 4 * * 0"   # 04:47 UTC Sunday = 10:17 IST Sunday
  workflow_dispatch: {}

jobs:
  run-skumaster-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run SKU Master report script
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/skumaster_report_to_drive.py
