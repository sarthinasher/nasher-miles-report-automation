name: Vinculum Sales Report to Drive

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch: {}

jobs:
  run-vinculum-sales-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pin Chrome ourselves instead of depending on whatever version the
      # runner image happens to ship. This is what prevents the intermittent
      # "Handshake status 404 Not Found" DevTools failure.
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Print Chrome version (for debugging)
        run: |
          which google-chrome || true
          google-chrome --version || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Vinculum Sales report script
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/vinculum_sales_report_to_drive.py
