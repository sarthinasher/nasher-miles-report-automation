name: Vinculum Sales Report to Drive

on:
  schedule:
    # Both runs use the catch-up window (2026-10-13): export every invoice day of the
    # last 7 (ending yesterday, IST) whose DD.MM.YYYY file is missing in Drive. The
    # second run normally finds nothing to do (no Vinculum login).
    - cron: "40 3 * * *"
    - cron: "40 8 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: >-
          Invoice date(s) to export, DD/MM/YYYY: one date (11/10/2026), a list or a
          range (11/10/2026-12/10/2026). Blank = catch-up (missing days of the last 7).
        required: false
        default: ""
      skip_existing:
        description: "With report_date: skip dates whose file is already in Drive (default: re-export and overwrite)"
        required: false
        default: false
        type: boolean
      sales_location:
        description: >-
          The ONE location the Sales Report is exported from (it is company-wide: every
          location returns the same rows). Blank = the repo variable SALES_LOCATION, else
          A02. A code (A02, NM4, ...) = that location; DEFAULT = no switch (the location
          the login lands on); ALL = the old loop over every location in "locations" +
          merge (slow: ~35 min per date for 17 locations).
        required: false
        default: ""
      locations:
        description: >-
          Only with sales_location=ALL: Vinculum locations to export and merge. Blank =
          the repo variable VIN_LOCATIONS, else all 17. "A03,NM4" = only those;
          "all,-S01,-S02" = all but those.
        required: false
        default: ""

# One Vinculum user for every report job: two sessions at once kill each other.
concurrency:
  group: vinculum-session
  cancel-in-progress: false

jobs:
  run-vinculum-sales-report:
    runs-on: ubuntu-latest
    # One location per date since 2026-10-23 (~2-3 min per date). 350 min still
    # allows sales_location=ALL (~35 min per date for 17 locations).
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pin Chrome ourselves instead of depending on whatever version the
      # runner image happens to ship. This is what prevents the intermittent
      # "Handshake status 404 Not Found" DevTools failure.
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Print Chrome version (for debugging)
        run: |
          which google-chrome || true
          google-chrome --version || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest==9.1.1

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run Vinculum Sales report script
        env:
          VIN_LOGIN_ID: ${{ secrets.VIN_LOGIN_ID }}
          VIN_PASSWORD: ${{ secrets.VIN_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          REPORT_DATE: ${{ inputs.report_date }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
          SALES_LOCATION: ${{ inputs.sales_location || vars.SALES_LOCATION }}
          VIN_LOCATIONS: ${{ inputs.locations || vars.VIN_LOCATIONS }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/vinculum_sales_report_to_drive.py

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sales-report-debug
          path: /tmp/vinculum_sales_debug
          if-no-files-found: ignore
