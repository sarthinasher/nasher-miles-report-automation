name: Sync Sales to SharePoint

on:
  schedule:
    # Mirrors the Sales files BY NAME (2026-10-13). Blank report_date = catch-up of the
    # last 7 days ending yesterday (2026-10-23): days missing on SharePoint, or re-exported
    # in Drive since, so a day whose export landed late is picked up by a later run.
    - cron: "5 4 * * *"
    - cron: "5 9 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: >-
          Invoice date(s) to mirror, DD/MM/YYYY (one, a list or a range); always
          re-uploaded. Blank = catch-up of the last 7 days (missing / re-exported ones).
        required: false
        default: ""

# Two syncs never write the same files at once (a manual run waits for a scheduled one).
concurrency:
  group: sync-sales-to-sharepoint
  cancel-in-progress: false

jobs:
  sync-sales-to-sharepoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Drive -> SharePoint sync
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          REPORT_DATE: ${{ inputs.report_date }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/sync_sales_to_sharepoint.py
